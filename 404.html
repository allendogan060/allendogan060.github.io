<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a5a49">
  <meta name="robots" content="noindex, nofollow">
  <title>Seite nicht gefunden - Haviko</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/haviko-icon-192.png">
  <link rel="manifest" href="./site.webmanifest">
  <style>
    :root {
      color-scheme: light;
      --forest: #0a5a49;
      --forest-deep: #063c32;
      --action: #087966;
      --ink: #15201d;
      --muted: #63706c;
      --line: #d8e1de;
      --background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: var(--background);
      text-align: center;
    }

    .pattern {
      position: fixed;
      inset: -20vh -20vw;
      z-index: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 18px;
      transform: rotate(8deg);
      opacity: 0.05;
    }

    .pattern-col {
      display: grid;
      gap: 18px;
      animation: drift-up 26s linear infinite;
    }

    .pattern-col.alt {
      animation-name: drift-down;
    }

    .pattern-col svg {
      width: 64px;
      height: 64px;
      color: var(--forest);
    }

    @keyframes drift-up {
      from { transform: translateY(0); }
      to { transform: translateY(-50%); }
    }

    @keyframes drift-down {
      from { transform: translateY(-50%); }
      to { transform: translateY(0); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 460px;
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(6, 60, 50, 0.16);
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--action);
      font-size: 13px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: clamp(72px, 16vw, 120px);
      line-height: 1;
      color: var(--forest-deep);
    }

    p.lead {
      margin: 18px 0 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .actions a {
      min-height: 48px;
      padding: 12px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 780;
      text-decoration: none;
    }

    .actions .primary {
      background: var(--action);
      color: white;
    }

    .actions .secondary {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }

    @media (prefers-reduced-motion: reduce) {
      .pattern-col { animation: none; }
    }
  </style>
</head>
<body>
  <div class="pattern" id="pattern" aria-hidden="true"></div>

  <main class="content">
    <img class="mark" src="./assets/haviko-app-icon.png" alt="">
    <p class="kicker">Haviko</p>
    <h1>404</h1>
    <p class="lead">Diese Seite gibt es nicht oder wurde verschoben.</p>
    <div class="actions">
      <a class="primary" href="https://haviko.de/">Zur Startseite</a>
      <a class="secondary" href="https://support.haviko.de/">Support kontaktieren</a>
    </div>
  </main>

  <script>
    (() => {
      const icon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 2v7"></path>
        <path d="M5 2v4a2 2 0 0 0 4 0V2"></path>
        <path d="M7 9v13"></path>
        <path d="M17 2c-1.7 0-3 2.2-3 5s1.3 5 3 5 3-2.2 3-5-1.3-5-3-5Z"></path>
        <path d="M17 12v10"></path>
      </svg>`;
      const container = document.getElementById("pattern");
      const columns = 14;
      const rows = 8;
      for (let c = 0; c < columns; c += 1) {
        const col = document.createElement("div");
        col.className = "pattern-col" + (c % 2 === 0 ? "" : " alt");
        let html = "";
        for (let r = 0; r < rows * 2; r += 1) {
          html += icon;
        }
        col.innerHTML = html;
        container.appendChild(col);
      }
    })();
  </script>
</body>
</html>
